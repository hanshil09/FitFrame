<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chair step 1</title>
<style>
:root{--bg:#f4f1ec;--panel:#fff;--text:#22201c;--muted:#6b675f;--accent:#d9822b;--border:#ddd8cf}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 -apple-system,system-ui,sans-serif;overflow:hidden}
#c{display:block;width:100vw;height:100vh;touch-action:none}
.card{position:absolute;top:16px;left:16px;max-width:min(400px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.k{font-size:12px;color:var(--muted)}
h1{font-size:16px;font-weight:600;margin:4px 0 6px}
.mate{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;background:#eef3e6;color:#3b6d11}
.badge.est{background:#faeeda;color:#854f0b}
.src{position:absolute;top:16px;right:16px;width:min(260px,38vw);background:#fff;border:1px solid var(--border);border-radius:12px;padding:8px}
.src img{width:100%;display:block;border-radius:6px}
.src .k{margin-top:4px}
.bar{position:absolute;left:16px;right:16px;bottom:16px;display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:8px 10px;flex-wrap:wrap}
button{font:inherit;border:1px solid var(--border);background:#faf8f5;border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--text)}
button:hover{border-color:#bbb}
input[type=range]{flex:1;min-width:120px}
label{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px;cursor:pointer}
.dots{display:flex;gap:4px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--border)}
.dot.on{background:var(--accent)}
@media (max-width:600px){.src{top:auto;bottom:120px;width:44vw}}
</style>
</head>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- What the extraction pass would return for this page (build-plan shape) ----------
// Sizes are not printed in this manual, so every dimension below is a category prior (estimated).
const PLAN = {
  parts: {
    C: { label: 'Nylon star base', template: 'star_base', params: { arms: 5, reach_cm: 30, hub_bore_cm: 5 } },
    E: { label: 'Lift cylinder',   template: 'gas_cylinder', params: { body_d_cm: 5, length_cm: 34 } },
    F: { label: 'Casters', count: 5, template: 'caster', params: { wheel_d_cm: 5, stem_d_mm: 11 } },
    H: { label: 'Covers for lift cylinder', template: 'telescoping_cover', params: { sections: 2 } },
  },
  substeps: [
    { id: '1a', title: 'Press the 5 casters F into the base C', mate: 'pin_in_hole · F.stem → C.socket[0..4]  (by pressure)', prov: 'Stated', dur: 4.8 },
    { id: '1b', title: 'Drop lift cylinder E into the centre of C', mate: 'pin_in_hole · E.bottom → C.hub_bore', prov: 'Stated', dur: 2.4 },
    { id: '1c', title: 'Slide cover H down over E', mate: 'pin_in_hole · H.bore ⟵ E.axis, seats on C.hub.top', prov: 'Stated', dur: 2.4 },
  ],
};

// ---------- Renderer, camera, lights ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;

const scene = new THREE.Scene();
const BG = new THREE.Color(0xf4f1ec), WHITE_BG = new THREE.Color(0xffffff);
scene.background = BG;
const pmrem = new THREE.PMREMGenerator(renderer);
const envMap = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = envMap;

const camera = new THREE.PerspectiveCamera(38, 1, 1, 2000);
camera.position.set(80, 62, 96);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 16, 0);
controls.enableDamping = true;

const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(40, 90, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -50, right: 50, top: 50, bottom: -50 });
scene.add(sun);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.ShadowMaterial({ opacity: 0.2 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);
const grid = new THREE.GridHelper(200, 20, 0xd8d2c6, 0xe6e1d8);
scene.add(grid);

// ---------- Part helper ----------
const edgeMat = new THREE.LineBasicMaterial({ color: 0x8a8378, transparent: true, opacity: 0.5 });
const outlined = [];
const offset = { polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 };
function part(geom, mat, edgeAngle = 30) {
  const m = new THREE.Mesh(geom, mat);
  m.castShadow = m.receiveShadow = true;
  m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geom, edgeAngle), edgeMat));
  m.userData.mat = mat;
  outlined.push(m);
  return m;
}
const nylon  = new THREE.MeshStandardMaterial({ color: 0x2a2a2d, roughness: 0.5, ...offset });
const rubber = new THREE.MeshStandardMaterial({ color: 0x3a3a3e, roughness: 0.85, ...offset });
const paint  = new THREE.MeshStandardMaterial({ color: 0x1c1c1e, metalness: 0.6, roughness: 0.3, ...offset });
const chrome = new THREE.MeshStandardMaterial({ color: 0xe6e6e6, metalness: 1, roughness: 0.12, ...offset });
const HOLE = new THREE.Color(0x111111), HOT = new THREE.Color(0xf2a23a), BLACK = new THREE.Color(0x000000);

// ---------- Template: star_base (C) ----------
const ARMS = 5, REACH = 28;
const ARM_BOTTOM = 7, ARM_H = 3, HUB_TOP = 13, BORE_R = 2.5, SOCKET_BOTTOM = 5.9;
const base = new THREE.Group();           // subassembly root for this step
scene.add(base);
const C = new THREE.Group();
base.add(C);

const armShape = new THREE.Shape();
armShape.moveTo(0, -3.4);
armShape.lineTo(REACH, -2.0);
armShape.absarc(REACH, 0, 2.0, -Math.PI / 2, Math.PI / 2, false);
armShape.lineTo(0, 3.4);
armShape.closePath();
const armGeom = new THREE.ExtrudeGeometry(armShape, { depth: ARM_H - 0.8, bevelEnabled: true, bevelSize: 0.4, bevelThickness: 0.4, bevelSegments: 3, curveSegments: 16 })
  .rotateX(-Math.PI / 2).translate(0, ARM_BOTTOM + 0.4, 0);
const socketGeom = new THREE.CylinderGeometry(1.9, 1.9, 10.4 - SOCKET_BOTTOM, 28).translate(0, (10.4 + SOCKET_BOTTOM) / 2, 0);

const tips = [], socketHoles = [];
for (let i = 0; i < ARMS; i++) {
  const a = Math.PI / 2 + i * 2 * Math.PI / ARMS;
  const arm = part(armGeom, nylon, 40);
  arm.rotation.y = a;
  C.add(arm);
  const tip = new THREE.Vector3(Math.cos(a) * REACH, 0, -Math.sin(a) * REACH);
  tips.push({ pos: tip, angle: a });
  const sock = part(socketGeom, nylon);
  sock.position.copy(tip);
  C.add(sock);
  const hole = new THREE.Mesh(new THREE.CircleGeometry(0.7, 20), new THREE.MeshBasicMaterial({ color: HOLE, side: THREE.DoubleSide }));
  hole.rotation.x = Math.PI / 2;
  hole.position.set(tip.x, SOCKET_BOTTOM - 0.03, tip.z);
  C.add(hole);
  socketHoles.push(hole);
}
const hub = part(new THREE.CylinderGeometry(5, 5.6, HUB_TOP - 6, 40).translate(0, (HUB_TOP + 6) / 2, 0), nylon);
C.add(hub);
const bore = new THREE.Mesh(new THREE.CircleGeometry(BORE_R, 32), new THREE.MeshBasicMaterial({ color: HOLE }));
bore.rotation.x = -Math.PI / 2;
bore.position.y = HUB_TOP + 0.03;
C.add(bore);
const hubGlow = new THREE.Mesh(new THREE.RingGeometry(BORE_R, 5, 40),
  new THREE.MeshBasicMaterial({ color: 0xf2a23a, transparent: true, opacity: 0, depthWrite: false }));
hubGlow.rotation.x = -Math.PI / 2;
hubGlow.position.y = HUB_TOP + 0.05;
C.add(hubGlow);

// ---------- Template: caster (F), origin = floor under the stem axis ----------
const housingGeom = new THREE.CylinderGeometry(2.9, 2.9, 2.2, 28, 1, false, Math.PI, Math.PI)
  .rotateZ(-Math.PI / 2).translate(0, 2.5, -1.0);
const wheelGeom = new THREE.CylinderGeometry(2.5, 2.5, 1.0, 36).rotateZ(Math.PI / 2);
const plateGeom = new THREE.CylinderGeometry(1.3, 1.3, 0.5, 24).translate(0, 5.65, 0);
const stemGeom = new THREE.CylinderGeometry(0.55, 0.55, 2.2, 16).translate(0, SOCKET_BOTTOM + 1.1, 0);
const casters = tips.map(({ pos, angle }) => {
  const g = new THREE.Group();
  g.add(part(housingGeom, nylon), part(plateGeom, chrome), part(stemGeom, chrome));
  for (const sx of [-1.6, 1.6]) {
    const w = part(wheelGeom, rubber);
    w.position.set(sx, 2.5, -1.0);
    g.add(w);
  }
  g.position.set(pos.x, 0, pos.z);
  g.rotation.y = angle + Math.PI / 2;
  base.add(g);
  return g;
});

// ---------- Template: gas_cylinder (E), origin = bottom tip ----------
const E_SEAT = HUB_TOP - 6;             // tapered end goes 6 cm into the hub bore
const bodyProfile = [[0, 0], [2.2, 0], [2.45, 6], [2.5, 6.3], [2.5, 26], [2.2, 26.6], [1.45, 26.8], [0, 26.8]]
  .map(([r, y]) => new THREE.Vector2(r, y));
const rodProfile = [[0, 26.8], [1.4, 26.8], [1.4, 32.6], [0.9, 33], [0.45, 33.1], [0.45, 34.2], [0, 34.2]]
  .map(([r, y]) => new THREE.Vector2(r, y));
const E = new THREE.Group();
E.add(part(new THREE.LatheGeometry(bodyProfile, 40), paint), part(new THREE.LatheGeometry(rodProfile, 32), chrome));
E.position.y = E_SEAT;
base.add(E);

// ---------- Template: telescoping_cover (H), origin = bottom rim ----------
const coverProfile = [[3.1, 0], [3.5, 0], [3.5, 11.5], [3.3, 12], [3.0, 12.2], [3.0, 22], [1.75, 22.4], [1.6, 22.4],
  [1.6, 22.0], [2.7, 21.8], [2.7, 12.4], [3.1, 12.0], [3.1, 0]].map(([r, y]) => new THREE.Vector2(r, y));
const coverMat = new THREE.MeshStandardMaterial({ color: 0x2c2c30, roughness: 0.45, side: THREE.DoubleSide, ...offset });
const H = part(new THREE.LatheGeometry(coverProfile, 48), coverMat);
H.position.y = HUB_TOP;
base.add(H);

// ---------- Timeline ----------
const S = PLAN.substeps;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const seg = (t, start, len) => clamp((t - start) / len);
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOutBack = t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const LIFT = 8;                          // base is held up while casters are pressed in, then set down
let lineArt = false;

function apply(s, t) {
  const dur = S[s].dur;
  edgeMat.color.set(lineArt ? 0x000000 : 0x8a8378);
  socketHoles.forEach(h => h.material.color.copy(lineArt ? BLACK : HOLE));
  bore.material.color.copy(lineArt ? BLACK : HOLE);
  hubGlow.material.opacity = 0;

  // 1a: base appears (held up), casters push up into the sockets, base is set down
  const appear = s > 0 ? 1 : ease(seg(t, 0, 0.9));
  const setDown = s > 0 ? 1 : ease(seg(t, 4.0, 0.7));
  base.position.y = LIFT * (1 - setDown);
  C.position.y = (1 - appear) * 14;
  casters.forEach((c, i) => {
    const start = 0.9 + i * 0.5;
    const raw = s > 0 ? 1 : seg(t, start, 0.75);
    c.visible = s > 0 || raw > 0 || t > start - 0.35;
    const p = easeOutBack(raw);          // small overshoot = "enters by pressure" snap
    c.position.y = -(LIFT - 2.5) * (1 - p) - (s === 0 ? 0 : 0);
    if (s === 0 && !lineArt) {
      const k = seg(t, start - 0.45, 0.7);
      if (k > 0 && k < 1) socketHoles[i].material.color.copy(HOLE).lerp(HOT, Math.sin(k * Math.PI));
    }
  });

  // 1b: lift cylinder drops down its axis into the hub bore
  E.visible = s >= 1;
  if (E.visible) {
    const p = s > 1 ? 1 : ease(seg(t, 0.5, 1.3));
    E.position.y = E_SEAT + (1 - p) * 14;
    if (s === 1 && !lineArt) {
      hubGlow.material.opacity = 0.45 * (0.6 + 0.4 * Math.sin(t * 7)) * (1 - seg(t, dur - 0.5, 0.5));
      const k = seg(t, 0.0, 0.8);
      if (k > 0 && k < 1) bore.material.color.copy(HOLE).lerp(HOT, Math.sin(k * Math.PI));
    }
  }

  // 1c: cover slides down over the cylinder and seats on the hub
  H.visible = s >= 2;
  if (H.visible) {
    const p = s > 2 ? 1 : ease(seg(t, 0.4, 1.4));
    H.position.y = HUB_TOP + (1 - p) * 26;
    if (s === 2 && !lineArt) hubGlow.material.opacity = 0.4 * (1 - seg(t, 1.4, 0.6)) * seg(t, 0.2, 0.4);
  }
}

// ---------- Line-art mode (what render-and-compare sends to the model) ----------
const flatWhite = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, ...offset });
function setLineArt(on) {
  lineArt = on;
  scene.background = on ? WHITE_BG : BG;
  scene.environment = on ? null : envMap;
  grid.visible = floor.visible = !on;
  outlined.forEach(m => m.material = on ? flatWhite : m.userData.mat);
  edgeMat.opacity = on ? 1 : 0.5;
}

// ---------- Player UI ----------
const $ = id => document.getElementById(id);
let step = 0, t = 0, playing = true;
S.forEach(() => { const d = document.createElement('div'); d.className = 'dot'; $('dots').appendChild(d); });

function ui() {
  const cur = S[step];
  $('stepNo').textContent = `Step ${cur.id} of 1a–1c`;
  $('title').textContent = cur.title;
  $('mate').textContent = cur.mate;
  $('badge').textContent = 'Step: ' + cur.prov;
  [...$('dots').children].forEach((d, i) => d.classList.toggle('on', i <= step));
  $('play').textContent = playing ? 'Pause' : 'Play';
}
function go(s) { step = clamp(s, 0, S.length - 1); t = 0; playing = true; ui(); }

$('prev').onclick = () => go(step - 1);
$('next').onclick = () => go(step + 1);
$('replay').onclick = () => go(step);
$('play').onclick = () => {
  if (!playing && t >= S[step].dur) {
    if (step === S.length - 1) return go($('all').checked ? 0 : step);
    if ($('all').checked) return go(step + 1);
    t = 0;
  }
  playing = !playing; ui();
};
$('scrub').oninput = e => { t = e.target.value / 1000 * S[step].dur; playing = false; ui(); };
$('lineart').onchange = e => setLineArt(e.target.checked);
$('showsrc').onchange = e => { $('src').style.display = e.target.checked ? '' : 'none'; };

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (playing) {
    t += dt;
    const dur = S[step].dur;
    if (t >= dur) {
      if ($('all').checked && step < S.length - 1) { step++; t = 0; }
      else { t = dur; playing = false; }
      ui();
    }
  }
  apply(step, t);
  $('scrub').value = Math.round(t / S[step].dur * 1000);
  controls.update();
  renderer.render(scene, camera);
});
ui();
</script>
</body>
</html>
